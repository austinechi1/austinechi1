    <text x="104" y="332" fill="#FFF7EF" font-size="18" font-weight="600">SQL • PostgreSQL</text>
    <text x="104" y="355" fill="#C9A692" font-size="14">Cleaning • CTEs • Windows</text>
    <rect x="332" y="270" width="235" height="105" rx="16" fill="#2A140E" stroke="#8E543D"/>
    <text x="356" y="301" fill="#E69A78" font-size="13" font-weight="700" letter-spacing="1.5">ANALYSIS</text>
    <text x="356" y="332" fill="#FFF7EF" font-size="18" font-weight="600">Python • pandas</text>
    <text x="356" y="355" fill="#C9A692" font-size="14">EDA • KPIs • Trends</text>
    <rect x="584" y="270" width="235" height="105" rx="16" fill="#2A140E" stroke="#8E543D"/>
    <text x="608" y="301" fill="#F2C1A5" font-size="13" font-weight="700" letter-spacing="1.5">REPORTING</text>
