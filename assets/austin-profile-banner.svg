  <text x="600" y="225" text-anchor="middle" fill="#C9A692" font-family="Consolas, monospace" font-size="15" letter-spacing="2">SQL  •  PYTHON  •  EXCEL  •  POSTGRESQL  •  DATA VISUALIZATION</text>
