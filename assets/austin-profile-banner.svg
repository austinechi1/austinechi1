<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Nwachukwu Austin — Data and Business Analyst</title>
  <desc id="desc">A dark professional profile banner with analytics skill cards and contact information.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#d4a72c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="28" fill="url(#grid)"/>
  <circle cx="85" cy="75" r="50" fill="#14b8a6" opacity=".12" filter="url(#glow)"/>
  <circle cx="1110" cy="405" r="70" fill="#d4a72c" opacity=".10" filter="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1197" height="497" rx="27" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="38" cy="32" r="6" fill="#14b8a6"/>
  <text x="56" y="38" fill="#94a3b8" font-family="Consolas, monospace" font-size="15" letter-spacing="2">ANALYTICS PROFILE / AUSTINECHI1</text>
  <text x="1138" y="38" text-anchor="end" fill="#5eead4" font-family="Consolas, monospace" font-size="14">● OPEN TO OPPORTUNITIES</text>
  <line x1="30" y1="58" x2="1170" y2="58" stroke="#334155"/>
  <text x="600" y="135" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="55" font-weight="700">Nwachukwu <tspan fill="#d4a72c">Austin</tspan></text>
  <rect x="470" y="151" width="260" height="4" rx="2" fill="url(#accent)"/>
  <text x="600" y="195" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="25" font-weight="600">Data &amp; Business Analyst</text>
  <text x="600" y="225" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="15" letter-spacing="2">SQL  •  PYTHON  •  EXCEL  •  POSTGRESQL  •  DATA VISUALIZATION</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="270" width="235" height="105" rx="16" fill="#0b1628" stroke="#334155"/>
    <text x="104" y="301" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1.5">DATA PREPARATION</text>
    <text x="104" y="332" fill="#f8fafc" font-size="18" font-weight="600">SQL • PostgreSQL</text>
    <text x="104" y="355" fill="#94a3b8" font-size="14">Cleaning • CTEs • Windows</text>
    <rect x="332" y="270" width="235" height="105" rx="16" fill="#0b1628" stroke="#334155"/>
    <text x="356" y="301" fill="#d4a72c" font-size="13" font-weight="700" letter-spacing="1.5">ANALYSIS</text>
    <text x="356" y="332" fill="#f8fafc" font-size="18" font-weight="600">Python • pandas</text>
    <text x="356" y="355" fill="#94a3b8" font-size="14">EDA • KPIs • Trends</text>
    <rect x="584" y="270" width="235" height="105" rx="16" fill="#0b1628" stroke="#334155"/>
    <text x="608" y="301" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1.5">REPORTING</text>
    <text x="608" y="332" fill="#f8fafc" font-size="18" font-weight="600">Excel • Visualization</text>
    <text x="608" y="355" fill="#94a3b8" font-size="14">Charts • Insights • Stories</text>
    <rect x="836" y="270" width="284" height="105" rx="16" fill="#0b1628" stroke="#334155"/>
    <text x="860" y="301" fill="#d4a72c" font-size="13" font-weight="700" letter-spacing="1.5">DIGITAL SOLUTIONS</text>
    <text x="860" y="332" fill="#f8fafc" font-size="18" font-weight="600">HTML • CSS • JavaScript</text>
    <text x="860" y="355" fill="#94a3b8" font-size="14">Websites • Git • GitHub</text>
  </g>
  <rect x="80" y="410" width="1040" height="48" rx="14" fill="#091322" stroke="#334155"/>
  <circle cx="105" cy="434" r="6" fill="#14b8a6"/>
  <text x="125" y="440" fill="#e2e8f0" font-family="Consolas, monospace" font-size="15">Turning raw information into clear insights and useful digital solutions.</text>
  <text x="1094" y="440" text-anchor="end" fill="#d4a72c" font-family="Consolas, monospace" font-size="15">BUILD • ANALYZE • COMMUNICATE</text>
</svg>
