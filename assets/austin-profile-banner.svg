  <text x="125" y="440" fill="#FFF7EF" font-family="Consolas, monospace" font-size="15">Turning raw information into clear insights and useful digital solutions.</text>
  <text x="1094" y="440" text-anchor="end" fill="#E69A78" font-family="Consolas, monospace" font-size="15">BUILD • ANALYZE • COMMUNICATE</text>
