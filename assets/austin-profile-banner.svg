<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Nwachukwu Austine — Data and Business Analyst</title>
  <desc id="desc">A warm espresso and terracotta professional profile banner with analytics skill cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B0E0A"/>
      <stop offset=".52" stop-color="#351A12"/>
      <stop offset="1" stop-color="#120907"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2C1A5"/>
      <stop offset="1" stop-color="#C96F4F"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F7D8C4" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="28" fill="url(#grid)"/>
  <circle cx="85" cy="75" r="50" fill="#F2C1A5" opacity=".15" filter="url(#glow)"/>
  <circle cx="1110" cy="405" r="70" fill="#C96F4F" opacity=".16" filter="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1197" height="497" rx="27" fill="none" stroke="#8E543D" stroke-width="3"/>
  <circle cx="38" cy="32" r="6" fill="#F2C1A5"/>
  <text x="56" y="38" fill="#C9A692" font-family="Consolas, monospace" font-size="15" letter-spacing="2">ANALYTICS PROFILE / AUSTINECHI1</text>
